services:
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecoair}
      POSTGRES_USER: ${POSTGRES_USER:-ecoair}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data
    deploy:
      resources:
        limits:
          memory: ${POSTGRES_MEMORY_LIMIT:-512M}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      options:
        max-size: 10m
        max-file: "3"

  backend:
    build:
      context: ./backend
      args:
        STUDENT_ID: ${STUDENT_ID:-905523}
    restart: unless-stopped
    environment:
      OPERATOR_ID: ${STUDENT_ID:-905523}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ecoair}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-ecoair}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS-http://localhost:3000,http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"
    networks:
      - edge
      - data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: ${BACKEND_MEMORY_LIMIT:-384M}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    logging:
      options:
        max-size: 10m
        max-file: "3"

  nginx:
    image: nginx:stable
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./backend/nginx/default.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - edge
    deploy:
      resources:
        limits:
          memory: ${NGINX_MEMORY_LIMIT:-64M}
    healthcheck:
      test: ["CMD-SHELL", "nginx -t && test -s /var/run/nginx.pid && kill -0 \"$(cat /var/run/nginx.pid)\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      options:
        max-size: 10m
        max-file: "3"

networks:
  edge:
    driver: bridge
  data:
    driver: bridge
    internal: true

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-taller-docker-_postgres_data}
